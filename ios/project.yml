name: TuneBridge
options:
  bundleIdPrefix: com.tunebridge
  # English is the base language; Turkish comes from the tr.lproj folders.
  # iOS picks the device language and adds Settings → TuneBridge → Language for switching.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  TuneBridge:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TuneBridge
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunebridge.app
    dependencies:
      - target: TuneBridgeShare
  TuneBridgeShare:
    type: app-extension
    platform: iOS
    deploymentTarget: '16.0'
    sources: [ShareExtension]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: TuneBridge
        CFBundleDevelopmentRegion: en
        ShareBaseURL: https://YOUR_DOMAIN_HERE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tunebridge.app.share
        APPLICATION_EXTENSION_API_ONLY: YES
